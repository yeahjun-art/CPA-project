<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#131311; color:#eeeae1; font-family:'IBM Plex Sans KR', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family: inherit; cursor: pointer; }
  a { color:#f0776c; text-decoration:none; }
  a:hover { color:#ff9a90; text-decoration:underline; }
  .hide { display: none !important; }

  @keyframes dk-bob { 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-9px) rotate(1.5deg)} }
  @keyframes dk-wiggle { 0%,100%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-7px,1px) rotate(-5deg)} 45%{transform:translate(6px,-3px) rotate(5deg)} 70%{transform:translate(-4px,2px) rotate(-3deg)} }
  @keyframes dk-in { from{opacity:0; transform:scale(.93)} to{opacity:1; transform:scale(1)} }
  @keyframes dk-pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* 로그인 화면 */
  #login { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; padding:48px 24px; background:radial-gradient(120% 90% at 50% 0%, #1f1d19 0%, #131311 62%); }
  .title-big { font-family:'Gowun Batang', serif; font-size:44px; font-weight:700; letter-spacing:-1px; }
  .lede { font-size:15px; color:#9b968c; line-height:1.75; max-width:420px; text-align:center; }
  .g-btn { display:flex; align-items:center; gap:12px; font-size:15.5px; font-weight:600; color:#1f1d1a; background:#f6f2e9; border:none; border-radius:999px; padding:15px 28px; }
  .g-btn:hover { background:#fff; }
  .g-mark { width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid #ddd7cb; display:flex; align-items:center; justify-content:center; font-family:'Gowun Batang', serif; font-size:14px; font-weight:700; color:#b91c1c; }

  /* 도깨비 */

  .dk-hero { width:200px; height:172px; animation:dk-bob 3.4s ease-in-out infinite; }
  .dk-big { width:236px; height:200px; animation:dk-wiggle .55s ease-in-out 2; }
  .horn { position:absolute; background:#f3e4c8; }
  .hood { position:absolute; background:#b91c1c; border-radius:50% 50% 40% 40%; box-shadow:inset 0 -14px 26px rgba(0,0,0,.2); }
  .face { position:absolute; background:#f3e4c8; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .eye { background:#2b1410; border-radius:50%; }
  .cheek { position:absolute; background:#f2a08e; border-radius:50%; opacity:.9; }
  .club { position:absolute; background:#8a5a34; z-index:0; }
  .knob { position:absolute; background:#a3703f; border-radius:50%; }
  .sleeve { position:absolute; background:#b91c1c; z-index:2; }
  .mitt { position:absolute; background:#f3e4c8; border-radius:50%; z-index:3; }

  /* 대시보드 */
  #app { min-height:100vh; padding:40px 24px 90px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  .wrap { width:100%; max-width:900px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:1px solid #2b2823; padding-bottom:18px; flex-wrap:wrap; }
  .card { background:#1a1917; border:1px solid #2b2823; border-radius:20px; }
  .pill { display:flex; align-items:center; gap:9px; padding:8px 14px; border:1px solid #2b2823; border-radius:999px; background:#1a1917; white-space:nowrap; font-size:12.5px; font-weight:600; color:#cfcac1; }
  .dot { width:7px; height:7px; border-radius:50%; background:#f0776c; animation:dk-pulse 1.6s ease-in-out infinite; }
  .ghost { font-size:12.5px; font-weight:500; color:#807b73; background:transparent; border:1px solid #2b2823; border-radius:999px; padding:9px 14px; }
  .ghost:hover { color:#eeeae1; border-color:#4a453e; }
  .timer { font-size:92px; font-weight:600; line-height:1; letter-spacing:-3px; font-variant-numeric:tabular-nums; }
  .btn-red { font-size:16px; font-weight:600; color:#fffaf0; background:#b91c1c; border:none; border-radius:999px; padding:15px 36px; }
  .btn-red:hover { background:#d32626; }
  .btn-line { font-size:16px; font-weight:600; color:#eeeae1; background:transparent; border:1.5px solid #4a453e; border-radius:999px; padding:15px 30px; }
  .btn-line:hover { border-color:#eeeae1; }
  .btn-green { font-size:16px; font-weight:600; color:#8fd6c4; background:transparent; border:1.5px solid #2f5f55; border-radius:999px; padding:15px 30px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:14px; }
  .stat { background:#1a1917; border:1px solid #2b2823; border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:9px; }
  .stat-k { font-size:12.5px; color:#807b73; font-weight:600; }
  .stat-v { font-size:29px; font-weight:600; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
  .bars { display:flex; align-items:flex-end; gap:10px; height:132px; }

  .row { display:grid; grid-template-columns:1.4fr 1fr .8fr .8fr; gap:12px; padding:13px 4px; border-top:1px solid #26241f; font-size:14.5px; align-items:center; }

  .goal-track { height:8px; background:#26241f; border-radius:999px; overflow:hidden; }

  .anger { font-family:'Gowun Batang', serif; font-size:50px; font-weight:700; color:#f7efe0; text-align:center; letter-spacing:-1px; line-height:1.15; }
  .anger-sub { font-size:16.5px; color:#b3ada2; text-align:center; max-width:520px; line-height:1.65; }

<script>

const GOAL_HOURS = 4;      // 하루 목표 시간

    ["또.", "변명은 듣지 않는다. 화면으로 돌아가라."]
  ]

const KEY = "dokkaebi-study-v1";
const DAY_NAMES = ["일","월","화","수","목","금","토"];

let state = { user: null, status: "idle", elapsed: 0, streak: 0, days: {} };
let base = 0, startedAt = 0, streakFrom = 0, leftAt = null, actx = null;

const $ = id => document.getElementById(id);

/* ---------------- 시간 유틸 ---------------- */
function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmt(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(t / 3600), Math.floor((t % 3600) / 60), t % 60].map(v => String(v).padStart(2, "0")).join(":");
}
function fmtShort(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  return h > 0 ? h + "시간 " + m + "분" : m + "분";
}
function dayOf(key) {
  return state.days[key] || { ms: 0, dist: 0, sessions: 0, best: 0 };
}

/* ---------------- 저장 / 불러오기 ---------------- */
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify({ days: state.days, user: state.user })); } catch (e) {}
}
function loadLocal() {
  try {
    const p = JSON.parse(localStorage.getItem(KEY) || "{}");
    state.days = p.days || {};
    if (!sb) state.user = p.user || null;
  } catch (e) {}
}

async function saveDay(key) {
  saveLocal();
  if (!sb || !state.user) return;
  const r = dayOf(key);
  await sb.from("study_days").upsert({
    user_id: state.user.id, day: key,
    total_ms: r.ms, distractions: r.dist, sessions: r.sessions, best_ms: r.best
  });
}

async function loadRemote() {
  if (!sb || !state.user) return;
  const { data } = await sb.from("study_days").select("*");
  if (!data) return;
  data.forEach(r => {
    state.days[r.day] = { ms: r.total_ms || 0, dist: r.distractions || 0, sessions: r.sessions || 0, best: r.best_ms || 0 };
  });
  saveLocal();
  render();
}

/* ---------------- 로그인 ---------------- */
async function initAuth() {
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  if (data.session) {
    const u = data.session.user;
    state.user = { id: u.id, name: u.user_metadata.full_name || "공부하는 사람", email: u.email };
    await loadRemote();
  }
  sb.auth.onAuthStateChange((_e, session) => {
    if (session) {
      const u = session.user;
      state.user = { id: u.id, name: u.user_metadata.full_name || "공부하는 사람", email: u.email };
      loadRemote();
    } else {
      state.user = null;
    }
    render();
  });
}

$("signInBtn").onclick = async () => {
  if (sb) {
    await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin } });
  } else {
    // Supabase 값을 아직 안 넣었을 때: 이 브라우저에만 저장하며 사용
    state.user = { id: "local", name: "공부하는 사람", email: "이 브라우저에 저장 중" };
    saveLocal();
    render();
  }
};

$("signOutBtn").onclick = async () => {
  if (sb) await sb.auth.signOut();
  state.user = null;
  state.status = "idle"; state.elapsed = 0; base = 0;
  saveLocal();
  render();
};

/* ---------------- 공부 버튼 ---------------- */
$("startBtn").onclick = () => {
  base = state.elapsed;
  startedAt = Date.now();
  streakFrom = Date.now();
  leftAt = null;
  state.status = "running";
  render();
};

$("pauseBtn").onclick = () => {
  if (state.status !== "running") return;
  base = state.elapsed;
  leftAt = null;
  state.status = "paused";
  state.streak = 0;
  render();
};

$("stopBtn").onclick = () => {
  const ms = state.elapsed;
  const key = dayKey();
  if (ms >= 1000) {
    const d = dayOf(key);
    state.days[key] = { ms: d.ms + ms, dist: d.dist, sessions: d.sessions + 1, best: Math.max(d.best, state.streak) };
    saveDay(key);
  }
  base = 0; leftAt = null;
  state.status = "idle"; state.elapsed = 0; state.streak = 0;
  render();
};

$("dismissBtn").onclick = () => {
  $("alert").classList.add("hide");
  leftAt = null;
  streakFrom = Date.now();
};

/* ---------------- 딴짓 감지 ---------------- */
function away() { if (state.status === "running" && !leftAt) leftAt = Date.now(); }

function back() {
  if (state.status !== "running" || !leftAt) return;
  const gone = Date.now() - leftAt;
  leftAt = null;
  if (gone < GRACE_SECONDS * 1000) return;
  bump();
}

function bump() {
  const key = dayKey();
  const d = dayOf(key);
  state.days[key] = { ms: d.ms, dist: d.dist + 1, sessions: d.sessions, best: Math.max(d.best, Date.now() - streakFrom) };
  streakFrom = Date.now();
  state.streak = 0;
  saveDay(key);

  const set = LINES[TONE] || LINES["귀엽게 툴툴"];
  const line = set[Math.floor(Math.random() * set.length)];
  $("angerLine").textContent = line[0];
  $("angerSub").textContent = line[1];
  $("alertCount").textContent = dayOf(key).dist;
  const dk = $("alertDk");
  dk.style.animation = "none";
  void dk.offsetWidth;
  dk.style.animation = "dk-wiggle .55s ease-in-out 2";
  $("alert").classList.remove("hide");
  if (SOUND) beep();
  render();
}

function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    actx = actx || new A();
    const g = actx.createGain();
    g.gain.value = 0.07;
    g.connect(actx.destination);
    [392, 294].forEach((f, i) => {
      const o = actx.createOscillator();
      o.type = "triangle";
      o.frequency.value = f;
      o.connect(g);
      o.start(actx.currentTime + i * 0.17);
      o.stop(actx.currentTime + i * 0.17 + 0.15);
    });
  } catch (e) {}
}

window.addEventListener("blur", away);
window.addEventListener("focus", back);
document.addEventListener("visibilitychange", () => document.hidden ? away() : back());

/* ---------------- 화면 그리기 ---------------- */
function render() {
  const signedIn = !!state.user;
  $("login").classList.toggle("hide", signedIn);
  $("app").classList.toggle("hide", !signedIn);
  if (!signedIn) return;

  $("userLabel").textContent = state.user.name + " · " + state.user.email;
  $("sessionLabel").textContent = fmt(state.elapsed);
  $("statusText").textContent = state.status === "running" ? "감시 중" : state.status === "paused" ? "잠시 멈춤" : "대기 중";

  $("startBtn").classList.toggle("hide", state.status === "running");
  $("startBtn").textContent = state.status === "paused" ? "이어서 공부" : "공부 시작";
  $("pauseBtn").classList.toggle("hide", state.status !== "running");
  $("stopBtn").classList.toggle("hide", state.elapsed <= 0);

  const key = dayKey();
  const today = dayOf(key);
  const totalToday = today.ms + (state.status === "idle" ? 0 : state.elapsed);
  const pct = Math.min(100, Math.round(totalToday / (GOAL_HOURS * 3600000) * 100));

  $("todayLabel").textContent = fmtShort(totalToday);
  $("distLabel").textContent = today.dist + "회";
  $("bestLabel").textContent = fmtShort(Math.max(today.best, state.streak));
  $("sessLabel").textContent = today.sessions + "개";
  $("goalText").textContent = fmtShort(totalToday) + " / " + GOAL_HOURS + "시간 (" + pct + "%)";
  $("goalFill").style.width = pct + "%";

  // 최근 7일 막대
  const week = [];
  let max = 1;
  for (let i = 6; i >= 0; i--) {
    const dt = new Date();
    dt.setDate(dt.getDate() - i);
    const k = dayKey(dt);
    const ms = dayOf(k).ms + (k === key && state.status !== "idle" ? state.elapsed : 0);
    max = Math.max(max, ms);
    week.push({ day: DAY_NAMES[dt.getDay()], ms });
  }
  $("bars").innerHTML = week.map(w =>
    '<div class="bar-col">' +
      '<div style="font-size:11px; color:#807b73">' + (w.ms >= 60000 ? (w.ms / 3600000).toFixed(1) + "h" : "") + '</div>' +
      '<div class="bar" style="height:' + Math.round(w.ms / max * 100) + '%"></div>' +
      '<div style="font-size:12px; color:#a9a49b; font-weight:500">' + w.day + '</div>' +
    '</div>'
  ).join("");

  // 날짜별 목록
  const keys = Object.keys(state.days).sort().reverse().slice(0, 10);
  if (!keys.length) {
    $("logRows").innerHTML = '<div style="padding:26px 4px; border-top:1px solid #26241f; font-size:14px; color:#807b73">아직 기록이 없다. 공부 시작을 눌러라.</div>';
  } else {
    $("logRows").innerHTML = keys.map(k => {
      const r = state.days[k];
      const p = k.split("-");
      return '<div class="row">' +
        '<div style="font-weight:500">' + p[1] + "월 " + Number(p[2]) + "일" + '</div>' +
        '<div>' + fmtShort(r.ms) + '</div>' +
        '<div style="color:#f0776c; font-weight:600">' + r.dist + '회</div>' +
        '<div style="color:#807b73">' + r.sessions + '개</div>' +
      '</div>';
    }).join("");
  }
}

setInterval(() => {
  if (state.status === "running") {
    const now = Date.now();
    state.elapsed = base + (now - startedAt);
    state.streak = now - streakFrom;
    render();
  }
}, 250);

loadLocal();
render();
initAuth();
</script>
</body>
</html>
